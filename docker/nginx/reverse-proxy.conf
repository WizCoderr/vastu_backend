# Nginx reverse proxy for api.vastuarunsharma.com
# Mount TLS certs at /etc/nginx/certs (fullchain.pem + privkey.pem)
# Invoice PDFs are served from the shared volume mounted at /var/www/invoices

upstream vastu_api {
    server api:3030;
    keepalive 32;
}

server {
    listen 80;
    server_name api.vastuarunsharma.com;

  # Redirect HTTP to HTTPS in production (comment out for local TLS-less testing)
  return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.vastuarunsharma.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 50m;

    gzip on;
    gzip_types application/json text/plain text/css application/javascript;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /health {
        proxy_pass http://vastu_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    location /storage/invoices/ {
        alias /var/www/invoices/;
        add_header Cache-Control "private, max-age=3600";
    }

    location / {
        proxy_pass http://vastu_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
