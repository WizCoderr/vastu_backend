# Full-stack production compose (sibling repos required).
#
# Expected layout on the server:
#   ~/vastu_backend/
#   ~/vastuarunsharma.com/
#   ~/admin.vastu/
#
# Usage:
#   cd ~/vastu_backend/deploy
#   cp .env.stack.example .env
#   docker compose -f docker-compose.stack.yml up -d --build
#   docker compose -f docker-compose.stack.yml up -d --scale payment-worker=3

name: vastu-stack-prod

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: vastu-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      PROCESS_ROLE: api
      RUN_PAYMENT_WORKERS: "false"
      RUN_MIGRATIONS: "true"
      REDIS_URL: redis://redis:6379
      REDIS_ENABLED: "true"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - whatsapp_session:/app/.wwebjs_auth
      - invoice_storage:/app/storage/invoices
      - upload_storage:/app/uploads
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3030/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    networks:
      - internal
      - edge

  payment-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    image: vastu-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["bun", "run", "src/worker.ts"]
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      PROCESS_ROLE: worker
      RUN_PAYMENT_WORKERS: "true"
      RUN_MIGRATIONS: "false"
      WHATSAPP_ENABLED: ${WORKER_WHATSAPP_ENABLED:-false}
      REDIS_URL: redis://redis:6379
      REDIS_ENABLED: "true"
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - invoice_storage:/app/storage/invoices
    networks:
      - internal

  website:
    build:
      context: ../../vastuarunsharma.com
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.vastuarunsharma.com}
    image: vastu-website:${IMAGE_TAG:-latest}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - edge

  admin-panel:
    build:
      context: ../../admin.vastu
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.vastuarunsharma.com}
    image: vastu-admin:${IMAGE_TAG:-latest}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - edge

  edge-nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      website:
        condition: service_healthy
      admin-panel:
        condition: service_healthy
    ports:
      - "${EDGE_HTTP_PORT:-80}:80"
      - "${EDGE_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/stack.conf:/etc/nginx/conf.d/default.conf:ro
      - ${SSL_CERT_DIR:-./nginx/certs}:/etc/nginx/certs:ro
      - invoice_storage:/var/www/invoices:ro
    networks:
      - edge
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  redis_data:
  whatsapp_session:
  invoice_storage:
  upload_storage:

networks:
  internal:
    driver: bridge
  edge:
    driver: bridge
