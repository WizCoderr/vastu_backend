# Production compose — API + workers + Redis (+ optional local Postgres).
# Usage:
#   cp .env.docker.example .env
#   docker compose -f docker-compose.prod.yml up -d --build
# Scale workers:
#   docker compose -f docker-compose.prod.yml up -d --scale payment-worker=3

name: vastu-backend-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles: ["local-db"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vastu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-vastu}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vastu} -d ${POSTGRES_DB:-vastu}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: vastu-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PROCESS_ROLE: api
      RUN_PAYMENT_WORKERS: "false"
      RUN_MIGRATIONS: "true"
      REDIS_URL: redis://redis:6379
      REDIS_ENABLED: "true"
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-vastu}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vastu}}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${API_BIND:-127.0.0.1:3030}:3030"
    volumes:
      - whatsapp_session:/app/.wwebjs_auth
      - invoice_storage:/app/storage/invoices
      - upload_storage:/app/uploads
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3030/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    networks:
      - internal
      - edge
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  payment-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: vastu-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["bun", "run", "src/worker.ts"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PROCESS_ROLE: worker
      RUN_PAYMENT_WORKERS: "true"
      RUN_MIGRATIONS: "false"
      WHATSAPP_ENABLED: ${WORKER_WHATSAPP_ENABLED:-false}
      REDIS_URL: redis://redis:6379
      REDIS_ENABLED: "true"
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-vastu}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vastu}}
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - invoice_storage:/app/storage/invoices
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    profiles: ["with-nginx"]
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/reverse-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ${SSL_CERT_DIR:-./docker/nginx/certs}:/etc/nginx/certs:ro
      - invoice_storage:/var/www/invoices:ro
    networks:
      - edge
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:
  whatsapp_session:
  invoice_storage:
  upload_storage:

networks:
  internal:
    driver: bridge
  edge:
    driver: bridge
