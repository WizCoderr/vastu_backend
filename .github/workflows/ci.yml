name: Backend CI

on:
  push:
    paths:
      - '**'
    branches: [main, master]
  pull_request:
    paths:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bunx prisma generate
      - run: bun test
      - run: bun run build
