name: Backend CI

on:
  push:
    paths:
      - '**'
    branches: [main, master]
  pull_request:
    paths:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vastu
          POSTGRES_PASSWORD: vastu
          POSTGRES_DB: vastu
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bunx prisma generate
      - run: bun test
      - run: bun run build
