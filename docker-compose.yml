version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: vastu_postgres
    restart: always
    environment:
      POSTGRES_USER: vastu
      POSTGRES_PASSWORD: vastu
      POSTGRES_DB: vastu
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vastu -d vastu"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vastu_redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build: .
    container_name: vastu_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://vastu:vastu@postgres:5432/vastu
      REDIS_URL: redis://redis:6379
      REDIS_ENABLED: "true"
      PAYMENT_PROVIDER: upi
      PAYMENT_BANK_PROVIDER: mock
      PROCESS_ROLE: api
      RUN_PAYMENT_WORKERS: "false"
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    ports:
      - "127.0.0.1:3030:3030"
    volumes:
      - whatsapp_session:/app/.wwebjs_auth
      - invoice_storage:/app/storage/invoices
    deploy:
      replicas: 1

  payment-worker:
    build: .
    restart: always
    command: ["bun", "run", "src/worker.ts"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://vastu:vastu@postgres:5432/vastu
      REDIS_URL: redis://redis:6379
      REDIS_ENABLED: "true"
      PROCESS_ROLE: worker
      RUN_PAYMENT_WORKERS: "true"
      WHATSAPP_ENABLED: "false"
    volumes:
      - invoice_storage:/app/storage/invoices

volumes:
  whatsapp_session:
  postgres_data:
  redis_data:
  invoice_storage:

networks:
  default:
    name: vastu_network
