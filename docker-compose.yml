version: "3.9"

services:
  backend:
    build: .
    container_name: vastu_backend
    restart: always
    env_file:
      - .env
    environment:
      PAYMENT_PROVIDER: razorpay
      PROCESS_ROLE: all
      RUN_PAYMENT_WORKERS: "false"
      RUN_MIGRATIONS: "true"
      REDIS_ENABLED: "false"
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    ports:
      - "127.0.0.1:3030:3030"
    volumes:
      - whatsapp_session:/app/.wwebjs_auth
      - invoice_storage:/app/storage/invoices
    deploy:
      replicas: 1

volumes:
  whatsapp_session:
  invoice_storage:

networks:
  default:
    name: vastu_network
