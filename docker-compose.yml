version: "3.9"

services:
  backend:
    build: .
    container_name: vastu_backend
    restart: always
    env_file:
      - .env
    ports:
      - "127.0.0.1:3030:3030"
    volumes:
      - whatsapp_session:/app/.wwebjs_auth
      - invoice_storage:/app/storage/invoices
    deploy:
      replicas: 1


networks:
  default:
    name: vastu_network
